name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download & Setup FFmpeg SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "third_party/ffmpeg"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extracted"
          $extractedDir = Get-ChildItem -Path "ffmpeg-extracted" -Directory | Select-Object -First 1
          Copy-Item -Path "$($extractedDir.FullName)\*" -Destination "third_party/ffmpeg" -Recurse -Force

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build MiniWallpaper
        run: |
          cmake --build build --config Release

      - name: Package Portable Release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver -eq "main") { $ver = "latest" }
          New-Item -ItemType Directory -Force -Path "dist/MiniWallpaper-Portable/assets"
          Copy-Item "build/Release/MiniWallpaper.exe" "dist/MiniWallpaper-Portable/" -Force
          Copy-Item "build/Release/MiniWallpaper.scr" "dist/MiniWallpaper-Portable/" -Force
          Copy-Item "build/Release/*.dll" "dist/MiniWallpaper-Portable/" -Force
          Copy-Item "third_party/ffmpeg/bin/*.dll" "dist/MiniWallpaper-Portable/" -Force
          Copy-Item "assets/*" "dist/MiniWallpaper-Portable/assets/" -Recurse -Force
          Copy-Item "README.md" "dist/MiniWallpaper-Portable/" -Force
          Copy-Item "LICENSE" "dist/MiniWallpaper-Portable/" -Force
          Compress-Archive -Path "dist/MiniWallpaper-Portable/*" -DestinationPath "MiniWallpaper-Portable-$ver-win64.zip" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MiniWallpaper-Portable-*.zip
          generate_release_notes: false
          body: |
            MiniWallpaper ${{ github.ref_name }} portable for Windows 64-bit.

            How to use: extract the zip file, then run MiniWallpaper.exe. No installer needed.
            Requires Windows 7 SP1 or newer.
