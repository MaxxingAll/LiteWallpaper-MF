name: Build and Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Configure
        run: cmake -B build -S . -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Stage executable and checksum
        shell: pwsh
        run: |
          Copy-Item "build/Release/LiteWallpaper-MF.exe" "LiteWallpaper-MF.exe"
          $size = (Get-Item "LiteWallpaper-MF.exe").Length
          if ($size -gt 1572864) { throw "Release executable exceeds the 1.5 MB size budget: $size bytes" }
          $hash = (Get-FileHash "LiteWallpaper-MF.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LiteWallpaper-MF.exe" | Set-Content -Encoding ascii "LiteWallpaper-MF.exe.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: LiteWallpaper-MF.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LiteWallpaper-MF.exe
            LiteWallpaper-MF.exe.sha256
          generate_release_notes: true
          body: |
            Portable Windows 10/11 video wallpaper. No installer or bundled codec libraries.

            H.264 is built into Windows. VP9, AV1, and HEVC files may require the corresponding Windows codec extensions.
